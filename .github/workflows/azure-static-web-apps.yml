name: Azure Static Web Apps deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.org' }}
          ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true
