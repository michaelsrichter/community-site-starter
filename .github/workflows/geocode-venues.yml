name: Geocode venues

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/content/venues/**'
      - 'src/content/settings/site.yml'

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run geocode -- --dry
